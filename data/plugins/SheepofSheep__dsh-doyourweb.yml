url: https://github.com/SheepofSheep/dsh-doyourweb
name: SheepofSheep/dsh-doyourweb
category: browser
description:
  en: 'Reference logged-in Chrome/Edge tabs and authorized local HTML pages with @ for reading, batched actions, screenshots and supported WebMCP tools; collect annotations in chat drafts with a draggable toolbar. Select running Windows apps with executable icons, use a matching installed local MCP or approve its installation, and fall back to Cua Driver computer use when no MCP matches. Shows the selected window when possible while allowing background execution.'
  zh: '用 @ 引用已登录的 Chrome / Edge 标签页及已授权的本地 HTML，读取、批量操作、截图并调用支持的 WebMCP 工具；拖动批注浮窗，将多条批注加入聊天草稿后统一发送。应用菜单只显示带程序图标的运行中窗口，优先连接匹配的本地 MCP，未安装先询问，无匹配时使用 Cua Driver computer use；尽量显示所选窗口，也支持后台执行。'
